name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (includes security rules)
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q

  # The same suite against PostgreSQL, the database the dashboard runs on, so the
  # migrations and every query are checked there too.
  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vulndash
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vulndash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulndash -d vulndash_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vulndash:ci-only-password@127.0.0.1:5432/vulndash_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests (PostgreSQL)
        run: pytest -q
